import groovy.json.JsonSlurper
import groovy.json.JsonOutput
apply plugin: 'com.android.application'

def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def releaseSigningConfigured = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
def appVersionCode = (System.getenv('ANDROID_VERSION_CODE') ?: '12').toInteger()
def appVersionName = System.getenv('ANDROID_VERSION_NAME') ?: '1.1.1'

android {
    buildFeatures { buildConfig true }
    namespace "com.pedro.financeirofamiliar"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pedro.financeirofamiliar"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        homol {
            initWith debug
            applicationIdSuffix '.homol'
            versionNameSuffix '-homol'
            matchingFallbacks = ['debug']
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Variant-specific assets never overwrite the production Capacitor configuration.
def homolAssets = layout.buildDirectory.dir('generated/homolAssets')
android.sourceSets.homol.assets.srcDir(homolAssets)
def generateHomolConfig = tasks.register('generateHomolConfig') {
    def targetUrl = providers.environmentVariable('ANDROID_HOMOL_URL').orElse('')
    inputs.property('homolUrl', targetUrl)
    inputs.file('src/main/assets/capacitor.config.json')
    outputs.dir(homolAssets)
    doLast {
        def uri = new URI(targetUrl.get())
        if (uri.scheme != 'https' || !uri.host || uri.userInfo || uri.query || uri.fragment
            || !(uri.path in ['', '/'])
            || uri.host in ['planilha-cyan.vercel.app', 'planilha-mocha.vercel.app']) {
            throw new GradleException('ANDROID_HOMOL_URL deve ser uma origem HTTPS de homologação, diferente de produção.')
        }
        def config = new JsonSlurper().parse(file('src/main/assets/capacitor.config.json'))
        config.appId = 'com.pedro.financeirofamiliar.homol'
        config.appName = 'Financeiro Homol'
        config.server = [androidScheme: 'https', url: uri.toString(), cleartext: false]
        def output = homolAssets.get().file('capacitor.config.json').asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson(config))
    }
}
tasks.configureEach { task ->
    if (task.name == 'mergeHomolAssets') task.dependsOn(generateHomolConfig)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
